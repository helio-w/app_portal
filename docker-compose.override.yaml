services:
  web:
    build:
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      # Dev-only defaults, override them in .env
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-change-moi}
      - DJANGO_SETTINGS_MODULE=app_portal.settings.dev
    volumes:
      - .:/app
      - data:/app/data
